* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #7a8896; 
    padding: 1rem 2rem;
}

.logo {
    color: rgb(132, 122, 122);
    font-size: 1.8rem;
    font-weight: bold;
}

.nav-links {
    list-style: none;
    display: flex;
    align-items: center;
}

.nav-links li {
    position: relative;
    margin: 0 15px;
}

.nav-links a {
    color: rgba(248, 248, 248, 0.842);
    text-decoration: none;
    padding: 10px;
    transition: background 0.3s;
}

.nav-links a:hover {
    background-color: #0056b3;
    border-radius: 5px;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: #004080; 
    min-width: 160px;
    z-index: 1;
    margin-top: 5px;
}

.dropdown:hover .dropdown-content {
    display: block;
}

.dropdown-content a {
    padding: 12px 16px;
    color: white;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #0056b3;
}

.menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
}

.menu-toggle .bar {
    height: 3px;
    width: 25px;
    background-color: white;
    margin: 3px 0;
}

@media (max-width: 768px) {
    .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 50px;
        right: 0;
        background-color: #004080;
        width: 100%;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: flex;
    }
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

font-size: 3rem;

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px; /* Space between images */
        }
        .image-link {
            display: flex;
            flex-direction: column;
            align-items:center;
            text-decoration: none; /* Removes underline from link */
            border: 2px solid #ccc; /* Adds a border around the image */
            border-radius: 10px; /* Rounds the corners of the border */
            overflow: hidden; /* Ensures the border doesn't extend outside the image */
            transition: transform 0.3s ease, border-color 0.3s ease; /* Smooth transition for hover effect */
            width:300px; /*Fixed width for consistent sizing*/
            margin-top: 50px;
            margin-right: 120px;
        }
        .image-link img {
            max-width: 500px; /* Responsive image */
            height: 200px;  /*Maintains aspect ratio */
            display: block; /* Removes bottom space */
            object-fit:cover;
        }
        .image-link:hover {
            transform: scale(1.05); /* Slightly enlarges image on hover */
            border-color: #0534ef; /* Changes border color on hover */
            
        }
        .image-title {
            margin-top: 10px; /* Space between image and title */
            font-weight: bold; /* Makes the title bold */
            text-align: center; /* Centers the title */
            color: rgb(249, 241, 0);
            display: flex;
            object-fit: cover;
        }
       
        
    </style>
